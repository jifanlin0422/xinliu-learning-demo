/* Continuous, original pixel runner. Visual rewards are independent of question bands. */
(function(root){

/* Mock-only playback; no app state, storage, answer service, or reward events. */
(function(){
 'use strict';

 const slot=document.getElementById('demo-scene'),page=document.querySelector('.runner-preview'),status=document.getElementById('demo-status');
 let flow,identity,frame=0,version=0,finished=false,celebrated=false,announced='';
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 function describe(phase){page.dataset.demoPhase=phase;if(phase!==announced){announced=phase;status.textContent={running:'小人持续向前跑。',climbing:'模拟答对，小人登上连通台阶。',celebrating:'全部模拟题答对，烟花庆祝。',complete:'完整演示已结束，可点击重播。',reduced:'减少动态效果已开启。'}[phase]||'';}}
 function tick(){frame=0;if(finished||reduced.matches)return;const p=runner.progress();if(!p){frame=requestAnimationFrame(tick);return;}
  while(flow.attempts.length<schedule.length&&p.elapsed>=schedule[flow.attempts.length]){flow.attempts.push({id:'mock-'+flow.attempts.length,correct:true});if(flow.attempts.length===schedule.length)flow.status='complete';runner.mount(slot,flow,identity);}
  const current=runner.progress();if(current.celebrating)celebrated=true;
  if(celebrated&&!current.celebrating&&current.elapsed>18){finished=true;describe('complete');return;}
  describe(current.celebrating?'celebrating':current.climbing?'climbing':'running');

  if(reduced.matches){flow={attempts:schedule.map((_,i)=>({id:'mock-static-'+i,correct:true})),status:'complete'};runner.mount(slot,flow,identity);describe('reduced');return;}
